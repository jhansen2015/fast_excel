name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # https://docs.github.com/en/actions/reference/runners/github-hosted-runners
        # https://github.com/actions/runner-images/issues/10721
        #os: [ubuntu-latest, ubuntu-22, ubuntu-24, macos-14, macos-15, macos-latest, windows-2022, windows-latest]
        os:
          - ubuntu-latest
#          - macos-latest
#          - windows-latest
          # Regressions
          # Runners never pick up these OSs
          #- ubuntu-24
          #- ubuntu-22
          #- ubuntu-20
          # macos-12 - 15, ruby 2.0 - 2.2
          # -----------------------------------------
          #
          # Error: Error: CRuby < 2.6 does not support macos-arm64.
          #        Either use a newer Ruby version or use a macOS image running on amd64, e.g., macos-15-intel.
          #        Note that GitHub changed the meaning of macos-latest from macos-12 (amd64) to macos-14 (arm64):
          #        https://github.blog/changelog/2024-04-01-macos-14-sonoma-is-generally-available-and-the-latest-macos-runner-image/
          #
          #        If you are using a matrix of Ruby versions, a good solution is to run only < 2.6 on amd64, like so:
          #        matrix:
          #          ruby: ['2.4', '2.5', '2.6', '2.7', '3.0', '3.1', '3.2', '3.3']
          #          os: [ ubuntu-latest, macos-latest ]
          #          # CRuby < 2.6 does not support macos-arm64, so test those on amd64 instead
          #          exclude:
          #          - { os: macos-latest, ruby: '2.4' }
          #          - { os: macos-latest, ruby: '2.5' }
          #          include:
          #          - { os: macos-15-intel, ruby: '2.4' }
          #          - { os: macos-15-intel, ruby: '2.5' }
          #- macos-15
          #- macos-14
          #- macos-12
          #
          # libxslxwriter doesn't build on windows-2022, ruby 2.0 - 2.2
          # -----------------------------------------
#           # @echo "Compiling ext/text_width ..."
#            # rake compile
#            Compiling libxlsxwriter ...
#            make[1]: Entering directory `/d/a/fast_excel/fast_excel/libxlsxwriter'
#            make[2]: Entering directory `/d/a/fast_excel/fast_excel/libxlsxwriter/third_party/minizip'
#            In file included from ioapi.c:29:0:
#            ioapi.h:52:18:
#              fatal error:
#                zlib.h: No such file or directory
#            compilation terminated.
#            make[2]: *** [ ioapi.o ] Error 1
#            make[2]: Leaving directory `/d/a/fast_excel/fast_excel/libxlsxwriter/third_party/minizip'
#            make[1]: *** [ third_party ] Error 2
#            make[1]: Leaving directory `/d/a/fast_excel/fast_excel/libxlsxwriter'
#            make.exe": *** [ all ] Error 2
          # -----------------------------------------
          #- windows-2022
        # Quote '3.0' so 3.0 doesn't get truncated to 3
        # Ruby 3.4 removes base64, maybe bigdecimal too?
        # The main / master branch has code that supports Ruby 2.3 and newer
        #ruby: ['2.0', 2.1, 2.2, 2.3, 2.4, 2.5, 2.6, 2.7, '3.0', 3.1, 3.2, 3.3]
        ruby: ['2.0', 2.1, 2.2]
        # TODO Find a better way to do this
        # https://docs.github.com/en/actions/how-tos/write-workflows/choose-what-workflows-do/run-job-variations
        exclude:
          # TODO Can we use an older macos version?
          # macos-latest: Error: Error: CRuby < 2.6 does not support macos-arm64.
          - os: macos-latest
            ruby: '2.0'
          - os: macos-latest
            ruby: 2.1
          - os: macos-latest
            ruby: 2.2
#          - os: macos-latest
#            ruby: 2.3
#          - os: macos-latest
#            ruby: 2.4
#          - os: macos-latest
#            ruby: 2.5
          # TODO Can we use an older windows version?
          # windows-latest: Also doesn't support
          - os: windows-latest
            ruby: '2.0'
          - os: windows-latest
            ruby: 2.1
          - os: windows-latest
            ruby: 2.2
          # An error occurred while installing ffi (1.15.5), and Bundler cannot continue.
#          - os: windows-latest
#            ruby: 2.3
          # Run rake test
          # ------------------------------------------
          #  /home/runner/work/fast_excel/fast_excel/test/test_helper.rb:15:in `require_relative': /home/runner/work/fast_excel/fast_excel/lib/fast_excel.rb:545: syntax error, unexpected ')' (SyntaxError)
          #  /home/runner/work/fast_excel/fast_excel/lib/fast_excel.rb:559: module definition in method body
          #  /home/runner/work/fast_excel/fast_excel/lib/fast_excel.rb:590: dynamic constant assignment
          #    ALIGN_ENUM = Libxlsxwriter.enum_type(:format_alignments)
          #                ^
          #  /home/runner/work/fast_excel/fast_excel/lib/fast_excel.rb:661: dynamic constant assignment
          #    BORDER_ENUM = Libxlsxwriter.enum_type(:format_borders)
          #                 ^
          #  /home/runner/work/fast_excel/fast_excel/lib/fast_excel.rb:707: syntax error, unexpected keyword_end, expecting end-of-input
          #    from /home/runner/work/fast_excel/fast_excel/test/test_helper.rb:15:in `<top (required)>'
          #    from /home/runner/work/fast_excel/fast_excel/test/format_test.rb:1:in `require_relative'
          #    from /home/runner/work/fast_excel/fast_excel/test/format_test.rb:1:in `<top (required)>'
          #    from /opt/hostedtoolcache/Ruby/2.0.0-p648/x64/lib/ruby/2.0.0/rubygems/core_ext/kernel_require.rb:55:in `require'
          #    from /opt/hostedtoolcache/Ruby/2.0.0-p648/x64/lib/ruby/2.0.0/rubygems/core_ext/kernel_require.rb:55:in `require'
          #    from /opt/hostedtoolcache/Ruby/2.0.0-p648/x64/lib/ruby/gems/2.0.0/gems/rake-12.3.3/lib/rake/rake_test_loader.rb:17:in `block in <main>'
          #    from /opt/hostedtoolcache/Ruby/2.0.0-p648/x64/lib/ruby/gems/2.0.0/gems/rake-12.3.3/lib/rake/rake_test_loader.rb:5:in `select'
          #    from /opt/hostedtoolcache/Ruby/2.0.0-p648/x64/lib/ruby/gems/2.0.0/gems/rake-12.3.3/lib/rake/rake_test_loader.rb:5:in `<main>'
          # rake aborted!
          # Command failed with status (1)
          # ------------------------------------------
          - os: ubuntu-latest
            ruby: 2.0
        include:
          # Run rake test
          #/Users/runner/work/fast_excel/fast_excel/test/test_helper.rb:15:in `require_relative': /Users/runner/work/fast_excel/fast_excel/lib/fast_excel.rb:545: syntax error, unexpected ')' (SyntaxError)
          #/Users/runner/work/fast_excel/fast_excel/lib/fast_excel.rb:559: module definition in method body
          #/Users/runner/work/fast_excel/fast_excel/lib/fast_excel.rb:590: dynamic constant assignment
          #    ALIGN_ENUM = Libxlsxwriter.enum_type(:format_alignments)
          #                ^
          #/Users/runner/work/fast_excel/fast_excel/lib/fast_excel.rb:661: dynamic constant assignment
          #    BORDER_ENUM = Libxlsxwriter.enum_type(:format_borders)
          #                 ^
          #/Users/runner/work/fast_excel/fast_excel/lib/fast_excel.rb:707: syntax error, unexpected keyword_end, expecting end-of-input
          #	from /Users/runner/work/fast_excel/fast_excel/test/test_helper.rb:15:in `<top (required)>'
          #	from /Users/runner/work/fast_excel/fast_excel/test/auto_width_test.rb:1:in `require_relative'
          #	from /Users/runner/work/fast_excel/fast_excel/test/auto_width_test.rb:1:in `<top (required)>'
          #	from /Users/runner/hostedtoolcache/Ruby/2.0.0-p648/x64/lib/ruby/2.0.0/rubygems/core_ext/kernel_require.rb:55:in `require'
          #	from /Users/runner/hostedtoolcache/Ruby/2.0.0-p648/x64/lib/ruby/2.0.0/rubygems/core_ext/kernel_require.rb:55:in `require'
          #	from /Users/runner/hostedtoolcache/Ruby/2.0.0-p648/x64/lib/ruby/gems/2.0.0/gems/rake-12.3.3/lib/rake/rake_test_loader.rb:17:in `block in <main>'
          #	from /Users/runner/hostedtoolcache/Ruby/2.0.0-p648/x64/lib/ruby/gems/2.0.0/gems/rake-12.3.3/lib/rake/rake_test_loader.rb:5:in `select'
          #	from /Users/runner/hostedtoolcache/Ruby/2.0.0-p648/x64/lib/ruby/gems/2.0.0/gems/rake-12.3.3/lib/rake/rake_test_loader.rb:5:in `<main>'
          #rake aborted!
          #Command failed with status (1)
          #
          #Tasks: TOP => test
          #(See full trace by running task with --trace)
          #- { os: macos-15-intel, ruby: '2.0' }
          # Run bundle install
          # ...
          # Running 'compile' for libxslt 1.1.32... ERROR, review
          #'/Users/runner/hostedtoolcache/Ruby/2.1.9/x64/lib/ruby/gems/2.1.0/gems/nokogiri-1.9.1/ext/nokogiri/tmp/x86_64-apple-darwin19.6.0/ports/libxslt/1.1.32/compile.log'
          #to see what happened. Last lines are:
          #========================================================================
          #  CC       attrvt.lo
          #  CC       xslt.lo
          #  CC       xsltlocale.lo
          #  CC       xsltutils.lo
          #  CC       pattern.lo
          #  CC       templates.lo
          #  CC       variables.lo
          #  CC       keys.lo
          #  CC       numbers.lo
          #  CC       extensions.lo
          #extensions.c:2286:37: error: incompatible function pointer types passing 'void
          #(void *, void *, xmlChar *)' (aka 'void (void *, void *, unsigned char *)') to
          #parameter of type 'xmlHashScanner' (aka 'void (*)(void *, void *, const unsigned
          #char *)') [-Wincompatible-function-pointer-types]
          # 2286 |         xmlHashScan(xsltModuleHash, xsltHashScannerModuleFree, 0);
          #      |                                     ^~~~~~~~~~~~~~~~~~~~~~~~~
          #/Users/runner/hostedtoolcache/Ruby/2.1.9/x64/lib/ruby/gems/2.1.0/gems/nokogiri-1.9.1/ports/x86_64-apple-darwin19.6.0/libxml2/2.9.8/include/libxml2/libxml/hash.h:213:22:
          #note: passing argument to parameter 'f' here
          #  213 |                                          xmlHashScanner f,
          #      |                                                         ^
          #1 error generated.
          #make[2]: *** [extensions.lo] Error 1
          #make[1]: *** [all-recursive] Error 1
          #make: *** [all] Error 2
          #- { os: macos-15-intel, ruby: '2.1' }
          # Same error as macos-15-intel, ruby 2.1
          #- { os: macos-15-intel, ruby: '2.2' }

    runs-on: ${{ matrix.os }}

    # TODO Consider restricting to specific branches?
    # https://stackoverflow.com/questions/69260199/is-there-a-way-to-restrict-what-branch-an-action-can-be-run-on
    steps:
      - uses: actions/checkout@v2
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}

      - run: bundle config set --local without 'benchmarks'
      - run: bundle install
      - run: make
      - run: make install

      - run: rake test
      - run: rake examples
      - run: gem build fast_excel.gemspec
