name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        #ruby: [2.7, '3.0', 3.1, 3.2, 3.3]
        ruby: [2.2, '3.0']

    runs-on: ${{ matrix.os }}

    # TODO Consider restricting to specific branches?
    # https://stackoverflow.com/questions/69260199/is-there-a-way-to-restrict-what-branch-an-action-can-be-run-on
    steps:
      - uses: actions/checkout@v2
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}

      - run: bundle config set --local without 'benchmarks'
      - run: bundle install
      - run: make
      - run: make install

      - run: rake test
      - run: rake examples
      - run: gem build fast_excel.gemspec
